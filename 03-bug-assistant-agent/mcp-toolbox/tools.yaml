# MCP Toolbox for Databases config (flat format, toolbox v1.x).
# Values like ${DB_HOST} are read from environment variables.
kind: source
name: tickets-db
type: postgres
host: ${DB_HOST}
port: ${DB_PORT}
database: ${DB_NAME}
user: ${DB_USER}
password: ${DB_PASSWORD}
---
kind: tool
name: search-tickets
type: postgres-sql
source: tickets-db
description: Search for similar or duplicate tickets using full-text search on title and
  description. Returns the top 3 matches with a relevance rank (higher is more similar).
parameters:
- name: query
  type: string
  description: Words describing the bug, e.g. "login page freezes".
statement: |
  -- match ANY of the words (OR), rank by how many / how well they match
  WITH q AS (SELECT replace(plainto_tsquery('english', $1)::text, '&', '|')::tsquery AS query)
  SELECT ticket_id, title, description, assignee, priority, status,
         round(ts_rank(search_doc, q.query)::numeric, 4) AS rank
  FROM tickets, q
  WHERE search_doc @@ q.query
  ORDER BY rank DESC
  LIMIT 3;
---
kind: tool
name: get-ticket-by-id
type: postgres-sql
source: tickets-db
description: Retrieve a ticket's details using its ID.
parameters:
- name: ticket_id
  type: integer
  description: The ticket ID.
statement: SELECT ticket_id, title, description, assignee, priority, status, creation_time, updated_time FROM tickets WHERE ticket_id = $1;
---
kind: tool
name: get-tickets-by-assignee
type: postgres-sql
source: tickets-db
description: Search tickets by assignee email.
parameters:
- name: assignee
  type: string
  description: The email (or part of it) of the assignee.
statement: SELECT ticket_id, title, assignee, priority, status FROM tickets WHERE assignee ILIKE '%' || $1 || '%';
---
kind: tool
name: get-tickets-by-status
type: postgres-sql
source: tickets-db
description: Search tickets by status ('Open', 'In Progress', 'Closed', 'Resolved').
parameters:
- name: status
  type: string
  description: Ticket status.
statement: SELECT ticket_id, title, assignee, priority, status FROM tickets WHERE status ILIKE '%' || $1 || '%';
---
kind: tool
name: get-tickets-by-priority
type: postgres-sql
source: tickets-db
description: Search tickets by priority ('P0 - Critical', 'P1 - High', 'P2 - Medium', 'P3 - Low').
parameters:
- name: priority
  type: string
  description: Ticket priority, e.g. "P0" or "P1 - High".
statement: SELECT ticket_id, title, assignee, priority, status FROM tickets WHERE priority ILIKE '%' || $1 || '%';
---
kind: tool
name: get-tickets-by-date-range
type: postgres-sql
source: tickets-db
description: Retrieve tickets created or updated within a date range.
parameters:
- name: start_date
  type: string
  description: Start date (inclusive), YYYY-MM-DD.
- name: end_date
  type: string
  description: End date (inclusive), YYYY-MM-DD.
- name: date_field
  type: string
  description: Which date to filter on, 'creation_time' or 'updated_time'.
statement: |
  SELECT ticket_id, title, priority, status, creation_time, updated_time FROM tickets
  WHERE (CASE WHEN $3 = 'updated_time' THEN updated_time ELSE creation_time END)::date
        BETWEEN $1::date AND $2::date
  ORDER BY creation_time;
---
kind: tool
name: update-ticket-priority
type: postgres-sql
source: tickets-db
description: Update the priority of a ticket by ID. Priority must be one of 'P0 - Critical',
  'P1 - High', 'P2 - Medium', 'P3 - Low'.
parameters:
- name: priority
  type: string
  description: New priority.
- name: ticket_id
  type: integer
  description: The ticket ID.
statement: UPDATE tickets SET priority = $1 WHERE ticket_id = $2 RETURNING ticket_id, priority;
---
kind: tool
name: update-ticket-status
type: postgres-sql
source: tickets-db
description: Update the status of a ticket by ID ('Open', 'In Progress', 'Closed', 'Resolved').
parameters:
- name: status
  type: string
  description: New status.
- name: ticket_id
  type: integer
  description: The ticket ID.
statement: UPDATE tickets SET status = $1 WHERE ticket_id = $2 RETURNING ticket_id, status;
---
kind: tool
name: create-new-ticket
type: postgres-sql
source: tickets-db
description: Create a new bug ticket. Returns the new ticket ID.
parameters:
- name: title
  type: string
  description: Short title of the bug.
- name: description
  type: string
  description: Detailed description of the bug.
- name: assignee
  type: string
  description: Assignee email (use empty string if unknown).
- name: priority
  type: string
  description: One of 'P0 - Critical', 'P1 - High', 'P2 - Medium', 'P3 - Low'.
- name: status
  type: string
  description: Initial status, normally 'Open'.
statement: |
  INSERT INTO tickets (title, description, assignee, priority, status)
  VALUES ($1, $2, NULLIF($3, ''), COALESCE(NULLIF($4, ''), 'P3 - Low'), COALESCE(NULLIF($5, ''), 'Open'))
  RETURNING ticket_id;
---
kind: group
name: tickets_toolset
tools:
- search-tickets
- get-ticket-by-id
- get-tickets-by-assignee
- get-tickets-by-status
- get-tickets-by-priority
- get-tickets-by-date-range
- update-ticket-priority
- update-ticket-status
- create-new-ticket
